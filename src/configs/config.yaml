# Configuration

# Model paths
models:
  detection:
    path: "src/runs/detect/train/weights/best.pt"
    class_names: ["ball", "goalkeeper", "player", "referee"]
    class_ids:
      ball: 0
      goalkeeper: 1
      player: 2
      referee: 3
    confidence_threshold: 0.55
    nms_threshold: 0.5
    imgsz: 640
  field_detection:
    weights_kp: "external/PnLCalib/weights/SV_FT_WC14_kp.pth"
    weights_line: "external/PnLCalib/weights/SV_FT_TSWC_lines.pth"
    keypoint_confidence_threshold: 0.15
    line_threshold: 0.40
    pnl_refine: true
    use_wp_calib: true
  reid:
    path: ""

# Tracking
tracking:
  type: "botsort"
  tracker_config: "botsort.yaml"
  max_age: 30
  min_hits: 3

# Shot detection
shot_detection:
  max_player_ball_distance: 2.0
  min_ball_speed: 8.0
  goal_proximity_distance: 20.0
  shot_cooldown: 1.5
  velocity_window_frames: 5

# xG model
xg:
  model_type: "xgboost"
  statsbomb_competitions:
  - {competition_id: 16, season_id: 4}
  - {competition_id: 9,  season_id: 281}
  - {competition_id: 9,  season_id: 27}
  features:
    - "shot_distance"
    - "shot_angle"
    - "body_part_foot"
    - "body_part_head"
    - "def_pressure"

# Homography
homography:
  min_quality_threshold: 0.15
  warmup_frames: 5
  history_size: 10
  kalman_process_noise: 0.0001
  kalman_measurement_noise: 0.01
  invert_x_axis: false
  recompute_threshold: 0.3

# Device
device: "mps"